[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "giraffe"
version = "0.1.0"
description = "Extract payment data from invoices and show a GiroCode (EPC QR)"
requires-python = ">=3.10"
dependencies = ["segno", "pypdf", "defusedxml"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
giraffe = "giraffe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
